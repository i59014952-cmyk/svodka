<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Страница со сводкой по клиентам: в поиск ей попадать нельзя ни при каком хостинге.
     noindex закрывает индексацию, noarchive — сохранённую копию в кэше поисковика. -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Сводка 03.08.2026 — 07.08.2026</title>
<style>
:root{--ink:#101828;--mut:#667085;--line:#e4e7ec}
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:var(--ink);
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:30px 20px 60px}
h1{font-size:23px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 20px 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
 font-weight:700;text-align:right;padding:14px 10px 9px;border-bottom:1px solid #d7dee8;
 white-space:nowrap}
th:first-child{text-align:left}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;
 font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-weight:600;padding-left:13px}
tr:last-child td{border-bottom:none}
td.dt{text-align:center;color:var(--mut);font-weight:400;white-space:nowrap}
th.dt{text-align:center}
.mut{color:#98a2b3;font-size:12px}

/* Ручные метки. Заливка насыщенная, но текст остаётся тёмным: на этих трёх тонах
   контраст с #101828 держится выше 7:1 — строка читается не хуже белой. В совсем
   плотный цвет с белым шрифтом не уходим: числа тогда теряют вес, а их сравнивают
   между строками глазами. Цвет дублируется левой полоской — метка видна и при
   печати в оттенках серого. */
tr.m-g td{background:#a5e8bf}
tr.m-y td{background:#ccd3dc}
tr.m-r td{background:#ffb8b8}
tr.m-g td:first-child{border-left-color:#0b7a3b!important}
tr.m-y td:first-child{border-left-color:#5f6b7c!important}
tr.m-r td:first-child{border-left-color:#c62828!important}
/* Приглушённый текст (дата, процент агента) на цветном фоне выцветал до 3:1 —
   ниже нормы читаемости. На размеченных строках он темнее: так все три цвета
   дают минимум 6,3:1 и колонка «Начали» остаётся различимой. */
tr[class^="m-"] td.dt,tr[class^="m-"] .mut{color:#3d4653}
</style></head><body><div class="wrap">
<h1>Сводка за 03.08.2026 — 07.08.2026</h1>

</div></body></html>
