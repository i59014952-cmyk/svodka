<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Страница со сводкой по клиентам: в поиск ей попадать нельзя ни при каком хостинге.
     noindex закрывает индексацию, noarchive — сохранённую копию в кэше поисковика.
     Дублируется в robots.txt и в заголовке ответа — их видит и робот, игнорирующий разметку. -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Сводка по компаниям</title>
<style>
:root{--ink:#1f2733;--mut:#6f6f68;--line:#ecece6;--edge:#dcdcd6;--head:#14140f;
 --brass:#9a6b2f;--deep:#1d3b30;--brick:#8a3f33}
*{box-sizing:border-box}
body{margin:0;background:#f2f2ef;color:var(--ink);
 font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:34px 26px 60px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
 color:var(--brass);margin-bottom:7px}
h1{font-family:Georgia,"PT Serif","Times New Roman",serif;font-size:38px;font-weight:400;
 letter-spacing:-.015em;line-height:1.1;margin:0 0 9px;color:var(--head)}
.sub{color:#5b5b55;font-size:14px;margin-bottom:18px}
.sub:empty{display:none}
.card{background:#fff;border:1px solid var(--edge);padding:4px 22px 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
/* Линия под шапкой — чёрная и жирнее внутренних: так шапка читается как шапка без заливки. */
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
 font-weight:700;text-align:right;padding:14px 10px 9px;border-bottom:1px solid var(--head);
 white-space:nowrap}
th:first-child{text-align:left}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;
 font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-weight:600;padding-left:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f6}
td.dt{text-align:center;color:var(--mut);font-weight:400;white-space:nowrap}
th.dt{text-align:center}
.mut{color:#8f8f86;font-size:12px}

/* Ручные метки. Заливка приглушена под бумагу, но правило прежнее: текст остаётся тёмным,
   контраст с #1f2733 на всех трёх тонах держится выше 9:1 — строка читается не хуже белой.
   В плотный цвет с белым шрифтом не уходим: числа тогда теряют вес, а их сравнивают между
   строками глазами. Цвет дублируется левой полоской — метка видна и в печати серым.
   Метка сильнее наведения, иначе на mouseover заливка пропадала бы. */
tr.m-g td,tr.m-g:hover td{background:#a9dfb8}
tr.m-y td,tr.m-y:hover td{background:#cacac0}
tr.m-r td,tr.m-r:hover td{background:#efd8d2}
tr.m-g td:first-child{border-left-color:#1d3b30!important}
tr.m-y td:first-child{border-left-color:#6f6f68!important}
tr.m-r td:first-child{border-left-color:#8a3f33!important}
/* Приглушённый текст (дата, процент агента) на цветном фоне выцветал ниже нормы
   читаемости. На размеченных строках он темнее. */
tr[class^="m-"] td.dt,tr[class^="m-"] .mut{color:#4a4a42}
/* Управление — в той же бумажной логике: прямые углы, рамка цвета края листа, единственный
   акцент — латунный (#9a6b2f) на наведении и тёмно-зелёный (#1d3b30) на выбранном. */
.chsec{margin:26px 0 0;border-top:1px solid var(--edge);padding-top:18px}
.chhead h2{font:600 17px Georgia,'PT Serif',serif;color:var(--head);margin:0 0 3px}
.chsub{font-size:12px;color:var(--mut);margin:0 0 14px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.chbox{border:1px solid var(--edge);padding:12px 14px 10px;background:#fff}
.chttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
 color:var(--mut);margin:0 0 8px}
.chcv{position:relative;height:170px}
.chpick{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.chpick button{font:inherit;font-size:12px;padding:5px 11px;border:1px solid var(--edge);
 background:#fff;color:var(--head);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chpick button:hover{border-color:var(--brass)}
.chpick button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.chpick i{display:inline-block;width:9px;height:9px;font-style:normal}
.chpick button.on i{outline:1px solid #fff}
@media(max-width:700px){.chgrid{grid-template-columns:1fr}.chcv{height:150px}}
.rangebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
input[type=date]{font:inherit;font-size:13px;padding:5px 9px;color:var(--head);
 border:1px solid var(--edge);background:#fff}
input[type=date]:hover{border-color:var(--brass)}
.dash{color:var(--mut)}
.rbtn{font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;color:var(--head);
 border:1px solid var(--edge);background:#fff;cursor:pointer}
.rbtn:hover{border-color:var(--brass);color:var(--brass)}
.rbtn.on{background:var(--deep);border-color:var(--deep);color:#fff}
.rbtn[disabled]{opacity:.45;cursor:default}
.rbtn[disabled]:hover{border-color:var(--edge);color:var(--head)}
.cmpbar{margin:0 0 16px}
.cmprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cmplab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
 color:var(--mut);margin-top:6px}
.cmprow .len{font-size:12px;color:var(--mut);min-width:44px}
.cmprow .x{cursor:pointer;color:var(--mut);font-weight:700;font-size:15px;padding:0 4px}
.cmprow .x:hover{color:var(--brick)}
.plab{font-size:12px;color:var(--mut)}
/* В сравнении клетка шире (число + доля + разница), и на узком экране таблица может не
   влезть. Прокручивается тогда сама карточка, а не вся страница. */
.card{overflow-x:auto}
/* Разница — в той же клетке и в той же строке, что число: отдельная колонка Δ на шесть
   показателей удвоила бы ширину, а отдельной строкой — вытянула бы блок фирмы по высоте.
   Дорожки фиксированной ширины: числа стоят строго друг под другом, разница — своей полосой
   справа от них. Без этого разница сдвигала число влево и столбик читался вразнобой. */
/* Дорожки НЕ привязаны к .psub: ровно такие же пустые дорожки получают шапка колонки и
   клетки с прочерком. Иначе шапка выравнивается по всей клетке (то есть по правому краю
   дорожки разницы) и стоит правее чисел, а прочерк, будучи одиночным символом, встаёт
   вообще в третьем месте. Одинаковые дорожки — одинаковые отступы, без подгонки цифр. */
.nv{display:inline-block;min-width:30px;text-align:right}
.sh{display:inline-block;min-width:32px;text-align:right;font-size:11.5px;
 font-weight:400;color:var(--mut);margin-left:5px}
.dl{display:inline-block;min-width:38px;text-align:right;margin-left:5px;
 font-size:11.5px;font-weight:400;color:var(--mut);white-space:nowrap;cursor:help}
.dl.up{color:var(--deep)}
.dl.dn{color:var(--brick)}
tr[class^="m-"] .dl,tr.psub.m-g .dl,tr.psub.m-y .dl,tr.psub.m-r .dl{color:#4a4a42}
/* Сравнение живёт в ТОЙ ЖЕ таблице: строка с названием фирмы, под ней строка на каждый
   период. Поэтому у строки фирмы нет нижней границы — она и подстроки читаются одним
   блоком, а линия и отступ сверху отделяют блок от предыдущего (до них блоки разделяла
   только пустота, и на длинном сравнении таблица читалась сплошной простынёй).
   Название фирмы в сравнении набрано как надзаголовок группы — тем же приёмом, что
   организации в отчёте (`.ptab tr.porgh`): разрядка, капитель, латунь. */
tr.porg td{border-bottom:none;border-top:1px solid var(--edge);padding:19px 10px 4px}
tr.porg:first-child td{padding-top:7px;border-top:none}
tr.porg td:first-child{font-size:11.5px;font-weight:700;text-transform:uppercase;
 letter-spacing:.08em;color:var(--brass)}
/* Дата первой задачи — второй строкой под названием, вместо убранного столбца «Начали».
   Капитель и разрядку надзаголовка приходится сбрасывать: строка не заголовок, а сноска.
   Кегль и тон намеренно ниже прежних 11px/#6f6f68: в тех она равнялась подписи периода
   («01.07–31.07 31 дн.», 14px тем же серым) и читалась как ещё одна строка периода, то есть
   мешала цифрам.
   Кегль и тон — РЕШЕНИЕ ЗАКАЗЧИКА, дважды подтверждённое (10.08.2026: «сделать едва
   заметным», затем «можно ещё мельче и светлее»). 9px/#adaca3 — это 2,3:1 на белом против
   15:1 у чисел и 5,1:1 у подписи периода, то есть НИЖЕ нормы читаемости: на ярком свете и на
   плохом экране строка почти исчезает. Возражение высказано и снято владельцем страницы —
   не «исправлять» обратно, приняв за небрежность. Промежуточные версии: 11px/#6f6f68
   (спорила с числами, равнялась подписи периода), 10px/#8a8980 (3,5:1). */
.ost{display:block;font-size:9px;font-weight:400;color:#adaca3;letter-spacing:0;
 text-transform:none;margin-top:3px;white-space:nowrap}
/* Кружок-метка у названия фирмы. Пустой — это ободок, а не заливка: пока метки нет, он не
   должен читаться как «серая метка». Размер и отступ подобраны так, чтобы палец на телефоне
   попадал (площадь клика расширена padding'ом, сам кружок остаётся мелким). */
.mkdot{display:inline-block;width:9px;height:9px;border-radius:50%;
 border:1.5px solid #c3c2b8;margin-right:7px;vertical-align:middle;cursor:pointer;
 box-sizing:content-box;padding:4px;background-clip:content-box}
.mkdot:hover{border-color:var(--brass)}
.mkdot.mk-g{background-color:#1d3b30;border-color:#1d3b30}
.mkdot.mk-y{background-color:#6f6f68;border-color:#6f6f68}
.mkdot.mk-r{background-color:#8a3f33;border-color:#8a3f33}
/* В печать и в PDF кружок не идёт: там метка видна заливкой строки, а пустой ободок у
   неразмеченных фирм читался бы как посторонний знак. */
@media print{.mkdot{display:none}}
.pdfmode .mkdot{display:none}
tr.porg:hover td{background:transparent}
tr.psub td:first-child{padding-left:30px;font-weight:400;color:var(--mut);
 white-space:nowrap}
tr.psub td{padding-top:8px;padding-bottom:8px}
#hint{color:var(--mut);font-size:12px;margin-top:12px}
#hint:empty{margin:0}

/* Вид на время сборки PDF: поля и кнопки прячутся (в файле они бессмысленны), рамка карточки
   снимается, прибитая первая колонка отпускается — сборщик считает position:sticky по-своему
   и сдвигает её. Класс живёт секунду, пока идёт снимок. */
.pdfmode .rangebar,.pdfmode .cmpbar,.pdfmode #hint{display:none}
.pdfmode .card{border:none;padding:0;overflow:visible}
.pdfmode th,.pdfmode td{position:static!important}

/* Телефон. Таблица из восьми колонок в 390 пикселей не влезает и влезть не может, поэтому
   она прокручивается внутри карточки — а колонка с названием фирмы при этом ПРИБИТА к левому
   краю: без неё, уехав вправо, невозможно понять, чья это строка. Прибитой клетке нужен свой
   фон, иначе через неё просвечивает прокручиваемое содержимое; у размеченных строк фон свой,
   поэтому он переопределяется отдельно. */
@media(max-width:700px){
 .wrap{padding:18px 12px 40px}
 h1{font-size:19px}
 .sub{font-size:12px}
 .card{padding:4px 12px 12px;-webkit-overflow-scrolling:touch}
 table{font-size:12.5px}
 th{padding:10px 7px 7px;font-size:9.5px}
 td{padding:9px 7px}
 td:first-child{padding-left:10px}
 th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:#fff}
 tr.m-g td:first-child{background:#a9dfb8}
 tr.m-y td:first-child{background:#cacac0}
 tr.m-r td:first-child{background:#efd8d2}
 /* Вертикальные волосяные линии — только на телефоне. Таблица здесь уезжает вбок, и без
    них глаз теряет колонку на середине прокрутки; на большом экране вся таблица видна
    целиком, и сетка была бы лишней рябью. */
 th:not(:last-child),td:not(:last-child){border-right:1px solid var(--line)}
 /* Граница прибитой колонки плотнее остальных: по ней видно, что данные уезжают ПОД неё,
    а не обрываются. */
 th:first-child,td:first-child{border-right:1px solid var(--edge)}
 /* Строка с названием фирмы — надзаголовок блока, сетка внутри неё только мешает. */
 tr.porg td:not(:first-child){border-right:none}
 /* Пальцем в кнопку 30 пикселей высотой попасть трудно — добираем до 34. */
 .rbtn{padding:8px 12px}
 input[type=date]{padding:7px 9px}
 .cmprow{gap:6px}
 .nv{min-width:24px}
 .sh{min-width:26px}
 .dl{min-width:32px;margin-left:4px}
}

/* Печать (она же «Сохранить как PDF»). Из файла уходят поля и кнопки — в бумаге они
   бессмысленны, — а даты периодов остаются: в сравнении они напечатаны в самих строках,
   в одиночном виде — в подписи над таблицей. Альбомная ориентация потому, что колонок
   восемь, а в сравнении в клетке ещё и разница: в портретной таблица не влезает. */
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff}
 .rangebar,.cmpbar,#hint{display:none!important}
 .wrap{max-width:none;padding:0}
 h1{font-size:17px}
 .sub{margin-bottom:9px;font-size:11px}
 .card{border:none;padding:0;overflow:visible}
 table{font-size:10.5px}
 th{padding:5px 6px}
 td{padding:5px 6px}
 /* Шапка повторяется на каждой странице, иначе со второй непонятно, где какая колонка. */
 thead{display:table-header-group}
 tr.porg{page-break-after:avoid}
 tr.psub{page-break-inside:avoid}
 /* Цвет разницы нужен и в PDF: знак несёт смысл, но красное/зелёное читается быстрее. */
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body><div class="wrap" id="wrap">
<div class="eyebrow">Данные по 25.08.2026</div>
<h1>Сводка по компаниям</h1>
<div class="rangebar">
 <span class="plab">Период:</span>
 <input type="date" id="d0" min="2026-04-03" max="2026-08-25"><span class="dash">—</span>
 <input type="date" id="d1" min="2026-04-03" max="2026-08-25">
 <span id="pre"></span>
</div>
<div class="cmpbar" id="cmpbar"></div>
<div class="sub" id="sub"></div>
<div class="card" id="card"><table>
<thead id="th"></thead>
<tbody id="tb"></tbody></table></div>
<!-- Блок «как читать» под таблицей убран 10.08.2026 по запросу — не возвращать. Определения
     показателей, инструкция по сравнению и оговорка про суммы жили здесь абзацем на треть
     экрана; заказчик читает эту страницу каждый день и в объяснениях не нуждается.
     #hint остался: он молчит в обычном состоянии и говорит только по делу — предупреждение
     про окна разной длины, процент по касанию с телефона, текст сбоя. -->
<div id="hint"></div>
<!-- Графики по каждому показателю таблицы (заведено 24.08.2026, по запросу). Идут ПОД
     таблицей: числа читают первыми, график отвечает на следующий вопрос — «как шло». -->
<div class="chsec" id="chsec">
 <div class="chhead">
  <h2>Динамика по показателям</h2>
  <div class="chsub" id="chsub"></div>
 </div>
 <div class="chpick" id="chpick"></div>
 <div class="chgrid" id="chgrid"></div>
</div>
<!-- Та же версия Chart.js, что на странице недель: две страницы одного сайта не должны
     тянуть разные мажорные версии. Версия прибита гвоздём — молча приехавшая новая
     сломала бы графики сразу у всех, как это уже учтено для html2pdf. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>

/* Период выбирает ЧИТАТЕЛЬ, поэтому таблица считается здесь, а не на сборке. Источник —
   S.clients[i].days (задачи по дням в разрезе режимов) и .u (человек → день → задач).

 render();hashPut();
}
/* Порядок строк: зелёные вверх, красные вниз, серые и неразмеченные между ними — то же
   правило, что в Python при сборке. Внутри группы сохраняется исходный порядок. */
function ordered(){
 var rank={g:0,y:1,r:2},out=S.clients.map(function(c,i){return {c:c,i:i};});
 out.sort(function(x,y){
  var rx=rank[markOf(x.c)],ry=rank[markOf(y.c)];
  if(rx===undefined)rx=1;
  if(ry===undefined)ry=1;
  return rx!==ry?rx-ry:x.i-y.i;});
 return out.map(function(o){return o.c;});
}
function mkDot(c){
 var m=markOf(c);
 return '<span class="mkdot'+(m?' mk-'+m:'')+'" onclick="event.stopPropagation();'
  +'mkCycle(\''+c.name.replace(/'/g,"\\'")+'\')" title="Пометить фирму:'
  +' зелёный → серый → красный → снять. Метка уходит в адрес страницы — отправьте ссылку,'
  +' и её увидят все"></span>';
}

function nf(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function ru(d){var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function shift(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);
 return t.toISOString().slice(0,10);}
/* Понедельник недели — тот же ключ, что в недельных срезах Python. getUTCDay() отдаёт 0
   для воскресенья, поэтому сдвиг считается как (день+6)%7, а не как сам номер дня. */
function mon(d){var t=new Date(d+'T00:00:00Z');return shift(d,-((t.getUTCDay()+6)%7));}
function clamp(d){return d<S.dmin?S.dmin:(d>S.dmax?S.dmax:d);}
/* Календарные месяцы. Считаются через Date.UTC, а не сложением дней: длина месяца разная,
   и февраль с переходом года складыванием не берётся. Date.UTC(год, месяц+1, 0) — это
   «нулевой день следующего месяца», то есть последний день нужного. */
function mStart(d){return d.slice(0,8)+'01';}
function mEnd(d){
 var t=new Date(d+'T00:00:00Z');
 return new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).toISOString().slice(0,10);
}
function mPrev(d){
 var t=new Date(d+'T00:00:00Z');
 var a=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()-1,1)).toISOString().slice(0,10);
 return {a:a,b:mEnd(a)};
}
function isMonth(p){
 return p.a.slice(8)==='01'&&p.a.slice(0,7)===p.b.slice(0,7)&&p.b===mEnd(p.a);
}
function ndays(a,b){return Math.round(
 (new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)+1;}

/* Окно передаётся аргументами, а не берётся из A/B: в сравнении колонок несколько, и
   считать их приходится по разным окнам за один проход.
   Даты сравниваются строками: ISO-формат для этого и годится, разбор в Date не нужен. */
function agg(c,a,b){
 var cn=0,we=0,ag=0,d,v;
 for(d in c.days){if(d>=a&&d<=b){v=c.days[d];cn+=v[0];we+=v[1];ag+=v[2];}}
 /* Люди — по матрице, а не по дневным суммам: «пользователей» это РАЗНЫЕ авторы за
    период, человек, писавший пять дней, обязан посчитаться один раз. */
 var act=0,act2=0;
 c.u.forEach(function(m){var n=0,k;for(k in m){if(k>=a&&k<=b)n+=m[k];}
  if(n>0){act++;if(n>1)act2++;}});
 return {chats:cn+we+ag,active:act,act2:act2,agent:ag,web:we,chat:cn};
}

/* Пресеты считаются от ПОСЛЕДНЕГО ДНЯ С ДАННЫМИ, а не от сегодняшней даты: выгрузка
   приходит ночью за прошедшие дни, и «текущая неделя» от системного числа могла бы
   оказаться пустой — читалось бы как отсутствие работы. */
/* Четыре пресета, и все — ЗАКРЫТЫЕ отрезки либо период целиком. Убраны 10.08.2026 по
   запросу: «30 дней» и «7 дней» — скользящие окна, ни к чему не привязанные; «один день» и
   «текущая неделя» — незакрытые: общая выгрузка приходит ночью, и у части компаний
   сегодняшний день пуст, а нули в нём читаются как отсутствие работы, хотя данных просто
   ещё нет. Сравнение по одному дню при этом никуда не делось — обе даты ставятся руками. */
var PRE=[
 ['Прошлая неделя', function(){var m=shift(mon(S.dmax),-7);return [m,shift(m,6)];}],
 ['Этот месяц',     function(){return [mStart(S.dmax),S.dmax];}],
 ['Прошлый месяц',  function(){var p=mPrev(S.dmax);return [p.a,p.b];}],
 ['Весь период',    function(){return [S.dmin,S.dmax];}]
];

function renderPre(){
 var h='';
 PRE.forEach(function(p,i){
  var r=p[1](),on=(clamp(r[0])===A&&clamp(r[1])===B)?' on':'';
  h+='<button class="rbtn'+on+'"'+(p[2]?' title="'+p[2]+'"':'')
   +' onclick="pre('+i+')">'+p[0]+'</button>';});
 document.getElementById('pre').innerHTML=h;
}
function pre(i){var r=PRE[i][1]();setP(r[0],r[1]);}

/* --- Сравнение периодов ---------------------------------------------------
   Колонки = зафиксированные окна плюс текущее, по возрастанию начала: дельта тогда
   означает «изменение во времени», а не «разницу с тем, что нажали раньше». Одинаковые
   окна склеиваются — иначе «добавить» дважды дало бы две тождественные колонки. */
function cols(){
 var seen={},out=[];
 CMP.concat([{a:A,b:B}]).forEach(function(p){
  var k=p.a+'..'+p.b;
  if(!seen[k]){seen[k]=1;out.push(p);}});
 out.sort(function(x,y){return x.a<y.a?-1:(x.a>y.a?1:(x.b<y.b?-1:(x.b>y.b?1:0)));});
 return out;
}
function lab(p){return ru(p.a).slice(0,5)+'–'+ru(p.b).slice(0,5);}
/* Проценты между окнами РАЗНОЙ длины врут по построению: за месяц задач больше, чем за
   неделю, просто потому что дней больше. В таком сравнении показываем только штуки. */
function sameLen(cs){
 var n=ndays(cs[0].a,cs[0].b);
 for(var i=1;i<cs.length;i++){if(ndays(cs[i].a,cs[i].b)!==n)return false;}
 return true;
}
/* Целые календарные месяцы сравнимы между собой, даже когда в них 30 и 31 день: это
   календарь, а не ошибка выбора, и месяц к месяцу — ровно то сравнение, которое люди
   и делают. Без этого послабления июль против июня уходил бы в серое «окна разной длины». */
function comparable(cs){
 if(sameLen(cs))return true;
 for(var i=0;i<cs.length;i++){if(!isMonth(cs[i]))return false;}
 return true;
}

/* «Добавить» приставляет к сравнению ещё одно окно НАЗАД от самого раннего, а основной
   период сверху не трогает. Первая версия уводила выбор на добавленное окно, и после двух
   нажатий поля с датами правили самый старый период — выглядело так, будто период сравнения
   выбрать вообще нельзя.

   Сдвиг — ЦЕЛЫМ ЧИСЛОМ НЕДЕЛЬ (наименьшее кратное 7, не меньше длины окна), а не длиной
   окна. Иначе рабочая неделя пн–пт (5 дней) сравнивалась бы с окном ср–вс: в него попадают
   суббота с воскресеньем, и падение выходных читается как провал показателя. Ровно то же
   правило, что в блоке «Что изменилось за неделю» в дашбордах: недели сопоставляются по
   дням недели, а не по порядку. Цена — зазор между окнами, когда длина не кратна семи
   (месяц против месяца сдвигается на 35 дней), но состав дней недели совпадает, а даты
   каждой строки напечатаны в ней самой. */
function oldest(){
 var o={a:A,b:B};
 CMP.forEach(function(p){if(p.a<o.a)o=p;});
 return o;
}
/* Окно, начинающееся с 1-го числа, — месячное: предыдущим считаем тот же отрезок прошлого
   месяца, а не сдвиг на целые недели. Иначе июль сравнивался бы с 27.05–26.06, и «месяц к
   месяцу» одним нажатием не получалось. Целый месяц → целый прошлый месяц; месяц с начала
   (01.08–10.08) → те же числа прошлого месяца (01.07–10.07), с поджатием, если в прошлом
   месяце столько дней нет (31.03 → 28.02). */
function prevOf(p){
 if(p.a.slice(8)==='01'&&p.a.slice(0,7)===p.b.slice(0,7)){
  var pm=mPrev(p.a);
  if(p.b===mEnd(p.a))return pm;
  var dd=parseInt(p.b.slice(8),10),me=parseInt(mEnd(pm.a).slice(8),10);
  return {a:pm.a,b:pm.a.slice(0,8)+('0'+Math.min(dd,me)).slice(-2)};
 }
 var st=7*Math.ceil(ndays(p.a,p.b)/7);
 return {a:shift(p.a,-st),b:shift(p.b,-st)};
}
/* Новый период предзаполняется окном такой же длины неделей раньше самого раннего — но это
   только заготовка: у строки свои поля с датами, и её сразу можно переписать. Раньше
   заготовка была единственным способом задать период, из-за чего «как добавить период»
   было непонятно вовсе. Упёрлись в начало накопителя — заготовка встаёт от первого дня. */
function taken(p){
 var k=p.a+'..'+p.b,yes=(A+'..'+B===k);
 CMP.forEach(function(q){if(q.a+'..'+q.b===k)yes=true;});
 return yes;
}
/* Кнопка «добавить период» НИКОГДА не гаснет. Первая версия гасила её, когда заготовка не
   помещалась раньше начала накопителя, — и при «Весь период», то есть в состоянии по
   умолчанию, кнопка была мёртвой: человек открывал страницу и видел, что сравнение
   недоступно вовсе (замечание заказчика 10.08.2026). Заготовка — только начальное значение
   полей, а нажимают кнопку ради самой строки с датами. */
function cmpAdd(){
 var o=oldest(),p=prevOf(o);
 if(p.b>=S.dmin&&!taken({a:clamp(p.a),b:clamp(p.b)})){
  CMP.push({a:clamp(p.a),b:clamp(p.b)});
 }else if(CMP.length===0&&A<=S.dmin&&B>=S.dmax){
  /* Основное окно накрывает ВЕСЬ накопитель — сравнивать его не с чем по построению.
     Единственное осмысленное чтение «сравнить периоды» здесь — сравнить свежие недели,
     поэтому окно сужается до последней недели, а в сравнение уходит предыдущая. Обе даты
     видны и в полосе, и в строках таблицы, так что подмены исподтишка нет. */
  var b1=S.dmax,a1=clamp(shift(b1,-6));
  CMP.push({a:clamp(shift(a1,-7)),b:clamp(shift(a1,-1))});
  A=a1;B=b1;
 }else{
  /* Заготовка занята — отступаем неделями назад, пока не найдём свободное окно. */
  var b=S.dmax,a=shift(b,-6),i=0;
  while(i<12&&taken({a:clamp(a),b:clamp(b)})){b=shift(b,-7);a=shift(a,-7);i++;}
  CMP.push({a:clamp(a),b:clamp(b)});
 }
 render();hashPut();
}
function cmpDel(i){CMP.splice(i,1);render();hashPut();}
/* Правка периода сравнения прямо в его полях. Недописанную дату браузер отдаёт пустой
   строкой — такое значение игнорируем, иначе период схлопывался бы на полпути к вводу. */
function cmpSet(i,which,v){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;
 var p=CMP[i];
 if(!p)return;
 if(which===0)p.a=clamp(v);else p.b=clamp(v);
 if(p.a>p.b){var t=p.a;p.a=p.b;p.b=t;}
 /* Полосу с периодами НЕ пересобираем — правим точечно. Пересборка через innerHTML
    уничтожала поле, в котором пользователь работает прямо сейчас, вместе с открытым
    календарём: событие уходило в уже удалённый узел. Перерисовываем только таблицу, а в
    полосе обновляем сами поля (даты могли поменяться местами) и подпись длины. */
 var ea=document.getElementById('ca'+i),eb=document.getElementById('cb'+i),
     ln=document.getElementById('len'+i);
 if(ea)ea.value=p.a;
 if(eb)eb.value=p.b;
 if(ln)ln.textContent=ndays(p.a,p.b)+' дн.';
 renderTable();hashPut();
}
function cmpClear(){CMP=[];render();hashPut();}
/* PDF скачивается файлом, а не открывает окно печати: `window.print()` в Safari сначала
   спрашивает «страница отправлена на печать, напечатать?», и до сохранения в PDF надо пройти
   ещё два шага — на «скачать» это не похоже.
   Сборщик (html2pdf) подгружается ТОЛЬКО по нажатию: на странице он лежал бы мёртвым
   грузом в четверть мегабайта. Нет интернета или CDN недоступен — откатываемся на печать,
   она работает всегда; правила печати для этого и оставлены в @media print.
   Плата за прямое скачивание: таблица внутри PDF — картинка (текст не выделяется). Ради
   резкости рендер идёт с масштабом 3, это ~280 dpi на A4. */
/* Версия прибита гвоздём, а не latest: сборщик тянется с чужого CDN, и молча приехавшая
   новая мажорная версия сломала бы кнопку у всех сразу. Адрес проверен запросом — 200,
   0,95 МБ; качается только по нажатию и дальше лежит в кеше браузера. */
var PDFLIB='https://cdn.jsdelivr.net/npm/html2pdf.js@0.14.0/dist/html2pdf.bundle.min.js';
/* Периоды в имени файла — в том же порядке, что в таблице: свежий первым. */
function pdfName(){
 return ('Сводка — '+cols().slice().reverse().map(lab).join(' и '))
  .replace(/[\/\\:*?"<>|]/g,'-')+'.pdf';
}
function pdfFallback(m){
 var h=document.getElementById('hint');
 if(h){h.style.color='';
  h.textContent='Собрать PDF не получилось ('+m+') — открыто окно печати: выберите в нём'
   +' «Сохранить как PDF».';}
 window.print();
}
/* Снимаем ВИДИМУЮ страницу, а не заготовку за краем экрана. Первая версия делала копию в
   элементе с position:fixed;left:-10000px — и сборщик отдавал пустой лист: он клонирует
   документ вместе со стилями, и элемент, унесённый за пределы окна, в кадр не попадает.
   Поэтому вместо копии на .wrap вешается класс pdfmode (он прячет поля и кнопки, ровно как
   правила печати), и после сборки снимается. Мигание на секунду — плата за надёжность.
   windowWidth:1200 заставляет сборщик считать раскладку по широкому окну, иначе с телефона
   в PDF уехала бы мобильная версия с прибитой колонкой. */
function pdfMake(){
 var w=document.getElementById('wrap');
 w.className='wrap pdfmode';
 var done=function(){w.className='wrap';};
 /* Масштаб подбираем под площадь полотна: на телефоне canvas больше ~10 млн точек Safari
    просто не отдаёт, и результат — белый лист. При обычной высоте выходит ~2, это ~190 dpi
    на A4; на длинном сравнении масштаб сам уменьшится, но лист останется непустым. */
 var h=w.scrollHeight||1200,sc=Math.sqrt(10000000/(1200*h));
 sc=Math.max(1,Math.min(2.5,sc));
 try{
  window.html2pdf().set({margin:8,filename:pdfName(),
    image:{type:'jpeg',quality:0.98},
    html2canvas:{scale:sc,backgroundColor:'#ffffff',windowWidth:1200,logging:false},
    pagebreak:{mode:['css','legacy'],avoid:'tr'},
    jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}})
   .from(w).save().then(done,function(){done();pdfFallback('сборщик отказал');});
 }catch(e){done();pdfFallback(e.message);}
}
function pdf(){
 if(window.html2pdf)return pdfMake();
 var s=document.createElement('script');
 s.src=PDFLIB;
 s.onload=pdfMake;
 s.onerror=function(){pdfFallback('нет доступа к сборщику');};
 document.head.appendChild(s);
}

/* У КАЖДОГО периода сравнения свои поля с датами: нажатие открывает календарь браузера,
   и дату можно вписать руками. Прежняя версия показывала периоды нередактируемыми плашками,
   а править их предлагалось единственной парой полей сверху, переключая «выделенный»
   период кликом, — на экране это читалось как «свой период задать нельзя». */
function dfld(v,i,which){
 return '<input type="date" id="c'+(which?'b':'a')+i+'" value="'+v+'"'
  +' min="'+S.dmin+'" max="'+S.dmax+'"'
  +' onchange="cmpSet('+i+','+which+',this.value)">';
}
function renderBars(){
 var h='';
 if(CMP.length){
  h+='<div class="cmplab">Сравнить с периодами:</div>';
  CMP.forEach(function(p,i){
   h+='<div class="cmprow">'+dfld(p.a,i,0)+'<span class="dash">—</span>'+dfld(p.b,i,1)
    +'<span class="len" id="len'+i+'">'+ndays(p.a,p.b)+' дн.</span>'
    +'<span class="x" title="убрать этот период" onclick="cmpDel('+i+')">×</span></div>';});
 }
 h+='<div class="cmprow">'
  +'<button class="rbtn" onclick="cmpAdd()">+ добавить период для сравнения</button>'
  +(CMP.length?'<button class="rbtn" onclick="cmpClear()">убрать сравнение</button>':'')
  +'<button class="rbtn" onclick="pdf()" title="Файл скачается сам, с этими периодами'
  +' в названии. Если интернета нет — откроется окно печати, там «Сохранить как PDF»">'
  +'Скачать PDF</button>'
  +'</div>';
 document.getElementById('cmpbar').innerHTML=h;
}

/* Разница — В ШТУКАХ и в той же клетке, что число. Процент ушёл в подсказку по наведению:
   шесть колонок × «−24 · −16%» превращают таблицу в кашу, а показать его всё равно надо.
   Порог базы и равенство длин решают, попадёт ли процент в подсказку вообще. */
function dlt(cur,prev,bs,eq,ptxt){
 var d=cur-prev,s=(d>0?'+':(d<0?'−':'±'))+nf(Math.abs(d)),tip=ptxt;
 if(eq&&prev>=bs&&d!==0)
  tip=(d>0?'+':'−')+Math.round(100*Math.abs(d)/prev)+'% '+ptxt;
 /* Красным и зелёным разница красится ТОЛЬКО при равных длинах окон. Иначе знак — артефакт
    длины, а не оценка: 10 дней против 31 дают «−414 задачи», и в цвете это читается как
    обвал. При неравных окнах цифра остаётся серой, а под таблицей сказано почему. */
 var cl=eq?(d>0?'up':(d<0?'dn':'')):'';
 if(!eq)tip='окна разной длины, '+tip;
 return '<span class="dl '+cl+'" title="'+tip+'" onclick="dlTap(this)">'+s+'</span>';
}
/* На телефоне наведения нет, и текст подсказки был бы недоступен вовсе. Поэтому он достаётся
   касанием: тапнули — он написан под таблицей. Работает для ЛЮБОГО элемента с title: так
   добываются и процент у разницы, и дата первой задачи у названия фирмы. На следующей
   перерисовке строка вернётся к своему обычному состоянию. */
function dlTap(e){
 var h=document.getElementById('hint');
 if(h&&e.title){h.style.color='';h.textContent=e.title;}
}

/* Таблица та же, что за один период: те же восемь колонок и та же ширина. Периоды
   становятся ПОДСТРОКАМИ под названием фирмы, поэтому все шесть показателей видны сразу
   и переключать их не нужно. */
/* «Начали» отдельным столбцом больше НЕТ (в сравнении он смешивал дату первой задачи фирмы
   и длину окна периода). Длина уехала к самим датам периода, а дата первой задачи стоит
   ВТОРОЙ СТРОКОЙ под названием фирмы. Сначала она была спрятана в подсказку по наведению —
   и это оказалось «нигде»: заказчик сразу спросил, где теперь смотреть. Подсказку, которую
   надо угадать, видимой информацией считать нельзя. */
function orgSince(c){
 return '<span class="ost">'+(c.first?'с '+ru(c.first):'задач ещё не было')+'</span>';
}
/* Шапка колонки получает ТАКИЕ ЖЕ пустые дорожки, что и клетки: без них она выравнивается по
   правому краю всей клетки, то есть по дорожке разницы, и стоит правее самих чисел. */
function headCells(){
 var h='';
 COLS.forEach(function(x){
  h+='<th>'+x[2]+(x[0]==='agent'?'<span class="sh"></span>':'')
   +'<span class="dl"></span></th>';});
 return h;
}
function renderCmp(cs){
 document.getElementById('card').className='card';
 document.getElementById('th').innerHTML='<tr><th>Организация</th>'+headCells()+'</tr>';
 var eq=comparable(cs),b='';
 ordered().forEach(function(c){
  var m=markOf(c),mk=m?' m-'+m:'';
  b+='<tr class="porg'+mk+'">'
   +'<td style="border-left:3px solid '+c.color+'">'+mkDot(c)+c.name+orgSince(c)+'</td>'
   +'<td colspan="6"></td></tr>';
  /* Считаем ПО ХРОНОЛОГИИ (cs идёт по возрастанию), а рисуем в обратном порядке: разница
     всегда «этот период минус предыдущий по времени», а свежая строка стоит сверху, сразу
     под названием фирмы. Так строка, на которую смотрят чаще всего, не съезжает вниз по
     мере добавления истории. Поэтому же считать и рисовать приходится в два прохода:
     дельта первой нарисованной строки берётся из строки, которая будет НИЖЕ неё.
     Компания к окну ещё не начинала — прочерки, а не нули: ноль читался бы как «доступ был,
     но не работали». Дельту от прочерка и к прочерку не считаем. */
  var recs=cs.map(function(p){
   var none=!!(c.first&&p.b<c.first);
   return {p:p,none:none,a:none?null:agg(c,p.a,p.b)};
  });
  recs.forEach(function(r,i){
   var pr=i>0?recs[i-1]:null;
   r.prev=(pr&&!pr.none&&!r.none)?pr.a:null;
   r.plab=pr?'к '+lab(pr.p):'';
  });
  recs.slice().reverse().forEach(function(r){
   b+='<tr class="psub'+mk+'"><td>'+lab(r.p)
    +' <span class="mut">'+ndays(r.p.a,r.p.b)+' дн.</span></td>';
   /* Каждая часть клетки — своя дорожка фиксированной ширины: число, доля агента, разница.
      Иначе разница, стоящая сразу за числом, сдвигает его влево, и в колонке числа
      оказываются на разных отступах — сравнивать столбик глазами нельзя. Пустые дорожки
      печатаются тоже: без них строка без разницы съезжает к краю. */
   COLS.forEach(function(x){
    /* Прочерк — в той же дорожке, что числа. Раньше клетка была class="dt" (по центру), и
       прочерк стоял в третьем месте: ни под числами, ни под шапкой. */
    if(r.none){
     b+='<td><span class="nv">—</span>'+(x[0]==='agent'?'<span class="sh"></span>':'')
      +'<span class="dl"></span></td>';
     return;}
    var v=r.a[x[0]];
    var cell=(x[0]==='chats'?'<b class="nv">'+nf(v)+'</b>':'<span class="nv">'+nf(v)+'</span>');
    if(x[0]==='agent')
     cell+='<span class="sh">'+(r.a.chats?Math.round(100*r.a.agent/r.a.chats)+'%':'')
      +'</span>';
    cell+=r.prev?dlt(v,r.prev[x[0]],x[1],eq,r.plab):'<span class="dl"></span>';
    b+='<td>'+cell+'</td>';});
   b+='</tr>';});
 });
 document.getElementById('tb').innerHTML=b;
 /* Подпись над таблицей в сравнении МОЛЧИТ (убрана 10.08.2026 по запросу): периоды и так
    видны и в полях дат, и в каждой строке, а «свежий период сверху» — объяснение того, что
    и без слов очевидно из порядка строк. В одиночном виде подпись остаётся: там она
    единственное место, где сказано, за какой период числа. */
 document.getElementById('sub').textContent='';
 /* В обычном состоянии строка МОЛЧИТ. Текст остаётся только там, где без него цифры можно
    прочитать неверно: при неравных окнах разница серая и без процента, и это надо объяснить.
    Пояснения «разница в штуках, процент по наведению» здесь больше нет — оно висело всегда
    и превратилось в шум. */
 document.getElementById('hint').textContent=eq ? ''
  : 'Длины периодов разные: разница в штуках сравнивает неравные окна, процент по '
    +'наведению не показывается вовсе.';
}

function renderOne(){
 document.getElementById('card').className='card';
 document.getElementById('th').innerHTML='<tr><th>Организация</th>'
  +'<th>Задач</th><th>Пользователей</th><th>из них 2+</th><th>Агентский</th>'
  +'<th>Поиск</th><th>Обычный</th></tr>';
 var h='';
 ordered().forEach(function(c){
  var a=agg(c,A,B),m=markOf(c);
  var pct=a.chats?' <span class="mut">'+Math.round(100*a.agent/a.chats)+'%</span>':'';
  h+='<tr'+(m?' class="m-'+m+'"':'')+'>'
   +'<td style="border-left:3px solid '+c.color+'">'+mkDot(c)+c.name+orgSince(c)+'</td>'
   +'<td><b>'+nf(a.chats)+'</b></td>'
   +'<td>'+nf(a.active)+'</td>'
   +'<td>'+nf(a.act2)+'</td>'
   +'<td>'+nf(a.agent)+pct+'</td>'
   +'<td>'+nf(a.web)+'</td>'
   +'<td>'+nf(a.chat)+'</td></tr>';
 });
 document.getElementById('tb').innerHTML=h;
 document.getElementById('sub').textContent='За '+ru(A)+' — '+ru(B)+' · дней '+ndays(A,B)
  +' · по одной строке на организацию';
 document.getElementById('hint').textContent='';
}

/* Пока периодов сравнения нет — прежняя таблица со всеми шестью показателями. Появился
   хоть один — та же таблица с подстроками: отдельная кнопка «сравнить» показывала бы то,
   что и так уже посчитано, то есть была бы лишним шагом.

   Условие по CMP, а не по числу колонок: если период сравнения выставили ровно таким же,
   как основной, окна склеиваются в одну колонку — и по числу колонок вид молча
   переключался бы на одиночный, хотя строка сравнения на экране осталась. */
function renderTable(){
 var h=document.getElementById('hint');
 h.style.color='';
 if(CMP.length)renderCmp(cols());else renderOne();
}
/* --- Графики по каждому показателю (24.08.2026) -------------------------------------
   Шесть картинок под таблицей — по одной на её колонку. Компания = линия, ось X = время
   ВНУТРИ основного периода (полоса «Период» сверху).

   Периоды сравнения графики НЕ рисуют, и это осознанно: окна могут стоять сколь угодно
   далеко друг от друга, накладывать их на одну ось времени — значит склеить март с
   августом и выдать это за динамику. Что сравнивать, показывает таблица; график отвечает
   на другой вопрос — как шло внутри выбранного окна. В подписи это сказано прямо.

   Шаг оси считается от длины окна: до 45 дней — по дням, дальше — по неделям с понедельника
   (как в pWeek). На весь пилот это 140 точек, из которых читается только шум.

   Дни ДО первой задачи компании дают null, а не 0 (spanGaps:false): ноль читался бы как
   «доступ был, но не работали», хотя компания ещё не начинала. То же правило, что на
   странице недель. */
var CH={}, MET=[
 ['chats','Задач',      function(v){return v[0]+v[1]+v[2];}],
 ['users','Пользователей',null],
 ['act2', 'Из них 2+',  null],
 ['agent','Агентский',  function(v){return v[2];}],
 ['web',  'Поиск',      function(v){return v[1];}],
 ['chat', 'Обычный',    function(v){return v[0];}]
];
function chSteps(){
 var out=[],d=new Date(A+'T00:00:00Z'),e=new Date(B+'T00:00:00Z');
 var days=Math.round((e-d)/864e5)+1, byWeek=days>45;
 if(byWeek){
  var m=new Date(d);m.setUTCDate(m.getUTCDate()-((m.getUTCDay()+6)%7));
  while(m<=e){
   var a=m.toISOString().slice(0,10);
   var z=new Date(m);z.setUTCDate(z.getUTCDate()+6);
   var b=z.toISOString().slice(0,10);
   out.push({a:a<A?A:a,b:b>B?B:b,lab:ru(a<A?A:a),days:0});
   m.setUTCDate(m.getUTCDate()+7);
  }
  /* Последняя неделя почти всегда неполная, и на графике это выглядит обрывом всех линий
     в ноль на правом краю — читается как «всё встало», хотя неделя просто не кончилась.
     Поймано 24.08.2026: понедельник один давал пятикратное падение у всех сразу.
     Откладываем её, если в ней меньше четырёх дней, — тем же правилом, что в блоке
     «Что изменилось за неделю». Одну точку не жалко: недельный шаг включается только
     на периодах длиннее 45 дней. */
  if(out.length>1){
   var L=out[out.length-1],
       n=Math.round((new Date(L.b+'T00:00:00Z')-new Date(L.a+'T00:00:00Z'))/864e5)+1;
   if(n<4)out.pop();
  }
 } else {
  while(d<=e){var k=d.toISOString().slice(0,10);
   out.push({a:k,b:k,lab:k.slice(8,10)+'.'+k.slice(5,7)});
   d.setUTCDate(d.getUTCDate()+1);}
 }
 return {steps:out,byWeek:byWeek};
}
/* На графике ВСЕГДА одна компания — та, что выбрана плашкой. Никакого «все сразу»:
   пять линий на одной картинке нечитаемы, что и показал первый заход, а промежуточная
   версия с приглушёнными чужими линиями оказалась не лучше — за серым ворохом никто не
   приходил, и он вдобавок растягивал ось Y по чужому максимуму.
   Сравнение компаний между собой даёт таблица выше; график отвечает на другой вопрос —
   как шло у одной. По умолчанию открывается ПЕРВАЯ компания списка (сейчас Татэнерго):
   именно списка, а не имени в коде, — иначе при перестановке CLIENTS страница открывалась
   бы пустой и никто бы этого не заметил.
   Значение глобальное, периода не касается. */
var CHSEL=null;
function chCur(){
 var n=CHSEL;
 for(var i=0;i<S.clients.length;i++)if(S.clients[i].name===n)return n;
 return S.clients.length?S.clients[0].name:null;   /* неизвестная — откатываемся к первой */
}
/* Повторный клик по выбранной ничего не делает: снять выбор нельзя, пустой график
   показывать нечего. */
function chPick(n){if(!n||n===CHSEL)return;CHSEL=n;renderPick();renderCharts();}
function renderPick(){
 var el=document.getElementById('chpick');
 if(!el)return;
 CHSEL=chCur();
 el.innerHTML=S.clients.map(function(c){
   /* Имя из конфига CLIENTS, не из пользовательского ввода — вставляется как есть,
      ровно так же, как в строках таблицы выше. */
   return '<button type="button" class="'+(CHSEL===c.name?'on':'')+
     '" onclick="chPick(\''+c.name.replace(/'/g,"\\'")+'\')">'+
     '<i style="background:'+c.color+'"></i>'+c.name+'</button>';}).join('');
}
function renderCharts(){
 var box=document.getElementById('chgrid');
 if(!box||typeof Chart==='undefined')return;      /* нет библиотеки — страница живёт без графиков */
 var st=chSteps(),steps=st.steps,labels=steps.map(function(x){return x.lab;});
 var sub=document.getElementById('chsub');
 if(sub)sub.textContent='Внутри периода '+ru(A)+' — '+ru(B)+', шаг '+
   (st.byWeek?'неделя':'день')+'. Периоды сравнения здесь не показываются: их окна '+
   'стоят в разных местах календаря, и на одной оси времени сравнивать их нечестно.';
 if(!box.firstChild){
  /* Легенды снизу больше нет: её заменили плашки выбора над графиками — там и цвет,
     и название, и переключение одним кликом. */
  box.innerHTML=MET.map(function(m){
   return '<div class="chbox"><div class="chttl">'+m[1]+'</div>'+
     '<div class="chcv"><canvas id="cv_'+m[0]+'"></canvas></div></div>';}).join('');
 }
 MET.forEach(function(m){
  var cur=chCur();
  var ds=S.clients.filter(function(c){
   return c.name===cur;                      /* только выбранная, чужих серий нет вовсе */
  }).map(function(c){
   var data=steps.map(function(s){
    if(s.b<c.first)return null;                   /* компания ещё не начинала — не ноль */
    var v=agg(c,s.a,s.b);
    return m[0]==='users'?v.active:(m[0]==='act2'?v.act2:
           (m[0]==='chats'?v.chats:(m[0]==='agent'?v.agent:
           (m[0]==='web'?v.web:v.chat))));
   });
   return {label:c.name,data:data,borderColor:c.color,backgroundColor:c.color,
           borderWidth:2.4,pointRadius:steps.length>25?0:2,tension:.25,spanGaps:false};
  });
  var el=document.getElementById('cv_'+m[0]);
  if(!el)return;
  if(CH[m[0]])CH[m[0]].destroy();
  CH[m[0]]=new Chart(el,{type:'line',data:{labels:labels,datasets:ds},
   options:{maintainAspectRatio:false,responsive:true,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},
     tooltip:{callbacks:{label:function(c){
       return c.dataset.label+': '+(c.raw===null?'—':c.raw);}}}},
    scales:{y:{beginAtZero:true,ticks:{precision:0,font:{size:10}},
               grid:{color:'#ecece6'}},
            x:{ticks:{maxTicksLimit:10,autoSkip:true,font:{size:10}},
               grid:{display:false}}}}});
 });
}
function render(){
 renderTable();
 document.getElementById('d0').value=A;
 document.getElementById('d1').value=B;
 renderPre();renderBars();renderPick();renderCharts();
}

/* Настройка живёт в адресе строки: #p=ДАТА..ДАТА[,ДАТА..ДАТА…]. Ссылку можно отправить, и у
   получателя откроется ровно то же сравнение. Порядок в p не сортированный: ПЕРВОЕ окно —
   основной период (полоса «Период» сверху), остальные — периоды сравнения в порядке строк.
   Полный период без сравнения в адресе НЕ запоминается — данные растут каждое утро, и
   ссылка «весь период» завтра значила бы уже другое окно. */
function hashPut(){
 var q=[];
 if(CMP.length||A!==S.dmin||B!==S.dmax)
  q.push('p='+[{a:A,b:B}].concat(CMP).map(function(p){return p.a+'..'+p.b;}).join(','));
 /* Метки читателя — в адрес. Названия кодируются целиком, а не номерами строк: номер
    съехал бы, если у клиента появится новая компания или изменится разметка на сборке, и
    старая ссылка пометила бы не ту фирму. Ссылка длиннее, зато не врёт. */
 var mk=[];
 for(var n in MK){if(MK[n])mk.push(encodeURIComponent(n)+':'+MK[n]);}
 if(mk.length)q.push('m='+mk.join(','));
 try{history.replaceState(null,'',location.pathname+(q.length?'#'+q.join('&'):''));}
 catch(e){}
}
function setP(a,b){
 A=clamp(a);B=clamp(b);
 if(A>B){var t=A;A=B;B=t;}
 render();hashPut();
}
/* Устаревшая ссылка страницу не роняет: даты поджимаются к краям накопителя, мусорные
   куски молча отбрасываются. */
function fromHash(){
 var hs=location.hash.replace(/^#/,''),got=false,ps=null;
 if(!hs)return false;
 /* Разбор по ключам, а не одной регуляркой на всю строку: старые ссылки с хвостом
    &m=показатель (переключатель показателя был убран 10.08.2026) должны открываться, а не
    отбрасываться целиком вместе с периодами. */
 var mkp=null;
 hs.split('&').forEach(function(kv){
  var i=kv.indexOf('=');
  if(i<0)return;
  if(kv.slice(0,i)==='p')ps=kv.slice(i+1);
  else if(kv.slice(0,i)==='m')mkp=kv.slice(i+1);});
 if(mkp){
  MK={};
  mkp.split(',').forEach(function(x){
   var j=x.lastIndexOf(':');
   if(j<1)return;
   var n=decodeURIComponent(x.slice(0,j)),v=x.slice(j+1);
   /* Незнакомая компания и посторонний цвет молча отбрасываются: ссылку могли собрать
      руками или она пришла от прежней версии данных. */
   if('gyr'.indexOf(v)<0||v.length!==1)return;
   S.clients.forEach(function(c){if(c.name===n){MK[n]=v;got=true;}});});
 }
 if(ps){
  var out=[];
  ps.split(',').forEach(function(x){
   var m=/^(\d{4}-\d{2}-\d{2})\.\.(\d{4}-\d{2}-\d{2})$/.exec(x);
   if(!m)return;
   var a=clamp(m[1]),b=clamp(m[2]);
   if(a>b){var t=a;a=b;b=t;}
   out.push({a:a,b:b});});
  if(out.length){var m=out.shift();A=m.a;B=m.b;CMP=out;got=true;}
 }
 return got;
}
/* Сбой в обработчике не должен оставлять пустую белую страницу: пишем причину текстом под
   таблицей. Страница опубликована, консоль читателю недоступна, и «белый экран» без
   объяснения — худшее, что она может показать. */
window.onerror=function(m,src,ln){
 var h=document.getElementById('hint');
 if(h){h.style.color='#c62828';
  h.textContent='Сбой на странице: '+m+' (строка '+ln+'). Обновите страницу — период'
   +' и сравнение восстановятся из её адреса. Если повторяется, передайте этот текст.';}
 return false;
};
document.getElementById('d0').addEventListener('change',function(){
 setP(this.value||S.dmin,B);});
document.getElementById('d1').addEventListener('change',function(){
 setP(A,this.value||S.dmax);});
window.addEventListener('hashchange',function(){if(fromHash())render();});
fromHash();render();

</script>
